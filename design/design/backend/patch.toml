package = "backend"
namespace = "plasm.backend"

[schema.AppState]
kind = "node"
role = "context"
fields = {bottom_panel = "BottomPanelState", chat = "ChatState", diagnostics = "Diagnostic[]", editor = "EditorState", last_run = "RunReport?", tasks = "TaskQueueState", ui = "UILayoutState", workspace = "WorkspaceState"}

[schema.Diagnostic]
kind = "node"
role = "diagnostic"
fields = {code = "string", file = "string?", location = "string?", message = "string", severity = "error|warning|info"}

[schema.Outcome_AgentRunResult]
kind = "node"
role = "response"
fields = {diagnostics = "Diagnostic[]", ok = "bool", value = "AgentRunResult?"}

[schema.Outcome_AppState]
kind = "node"
role = "response"
fields = {diagnostics = "Diagnostic[]", ok = "bool", value = "AppState?"}

[schema.Patch]
kind = "node"
role = "code"
fields = {diff = "string", files = "string[]"}

[func.backend_apply_patch]
intent = "Apply patch to workspace and refresh affected documents/tree"
input = ["schema.AppState", "schema.Outcome_AgentRunResult"]
output = ["schema.Outcome_AppState"]

[mod.backend_patch]
purpose = "Rust(Tauri) backend: apply patch to workspace and refresh documents"
schemas = ["schema.AppState", "schema.Outcome_AgentRunResult", "schema.Patch", "schema.Outcome_AppState", "schema.Diagnostic"]
funcs = ["func.backend_apply_patch"]
pipeline = ["func.backend_apply_patch"]

