package = "frontend"
namespace = "plasm.ui"

[schema.AgentScope]
kind = "node"
role = "data"
fields = {exclude_globs = "string[]", files = "string[]", include_globs = "string[]", preset = "workspace|folder|files|selection|mod|package", roots = "string[]"}

[schema.AppState]
kind = "node"
role = "context"
fields = {bottom_panel = "BottomPanelState", chat = "ChatState", diagnostics = "Diagnostic[]", editor = "EditorState", last_run = "RunReport?", tasks = "TaskQueueState", ui = "UILayoutState", workspace = "WorkspaceState"}

[schema.Diagnostic]
kind = "node"
role = "diagnostic"
fields = {code = "string", file = "string?", location = "string?", message = "string", severity = "error|warning|info"}

[schema.Outcome_AgentRunResult]
kind = "node"
role = "response"
fields = {diagnostics = "Diagnostic[]", ok = "bool", value = "AgentRunResult?"}

[schema.Outcome_AppState]
kind = "node"
role = "response"
fields = {diagnostics = "Diagnostic[]", ok = "bool", value = "AppState?"}

[schema.Outcome_Document]
kind = "node"
role = "response"
fields = {diagnostics = "Diagnostic[]", ok = "bool", value = "Document?"}

[schema.Outcome_ScopeUpdateResult]
kind = "node"
role = "response"
fields = {diagnostics = "Diagnostic[]", ok = "bool", value = "ScopeUpdateResult?"}

[schema.Outcome_TestResult]
kind = "node"
role = "response"
fields = {diagnostics = "Diagnostic[]", ok = "bool", value = "TestResult?"}

[schema.ScopeSelectionState]
kind = "node"
role = "ui"
fields = {active_preset = "workspace|folder|files|selection|mod|package", exclude_globs = "string[]", include_globs = "string[]", preview_files = "string[]", selected_files = "string[]", selected_roots = "string[]"}

[schema.ScopeUpdateRequest]
kind = "node"
role = "request"
fields = {exclude_globs = "string[]", files = "string[]", include_globs = "string[]", preset = "workspace|folder|files|selection|mod|package", roots = "string[]"}

[schema.ScopeUpdateResult]
kind = "node"
role = "response"
fields = {preview_files = "string[]", scope = "AgentScope", warnings = "string[]"}

[func.backend_resolve_scope_preview]
intent = "Resolve scope to concrete file list for preview (globs, excludes, selections)"
input = ["schema.AppState", "schema.ScopeUpdateRequest"]
output = ["schema.Outcome_ScopeUpdateResult"]

[func.ui_show_diagnostics]
intent = "Present diagnostics in UI (inline + panel) and block if errors"
input = ["schema.AppState", "schema.Outcome_AppState", "schema.Outcome_Document", "schema.Outcome_AgentRunResult", "schema.Outcome_ScopeUpdateResult", "schema.Outcome_TestResult"]
output = ["schema.AppState"]

[func.ui_update_scope]
intent = "Update scope selection for agent runs and show preview"
input = ["schema.AppState", "schema.ScopeUpdateRequest"]
output = ["schema.AppState", "schema.Outcome_ScopeUpdateResult"]

[mod.ui_scope_selector]
purpose = "Chat scope selector: preset + preview file list"
schemas = ["schema.AppState", "schema.AgentScope", "schema.ScopeSelectionState", "schema.ScopeUpdateRequest", "schema.ScopeUpdateResult", "schema.Outcome_ScopeUpdateResult", "schema.Diagnostic"]
funcs = ["func.ui_update_scope", "func.backend_resolve_scope_preview", "func.ui_show_diagnostics"]
pipeline = ["func.ui_update_scope", "func.backend_resolve_scope_preview", "func.ui_show_diagnostics"]

